name: Build Modding Editor Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:

    name: Build Windows + macOS

    runs-on:
      - self-hosted
      - macOS

    steps:

      # ============================================================
      # PREPARE SELF-HOSTED MAC
      # ============================================================

      - name: Prepare self-hosted Mac
        shell: bash
        run: |
          echo "======================================"
          echo "SELF HOSTED MAC"
          echo "======================================"

          echo "User:"
          whoami

          echo ""
          echo "Home:"
          echo "$HOME"

          echo ""
          echo "Runner:"
          echo "$RUNNER_NAME"

          echo ""
          echo "Architecture:"
          echo "$RUNNER_ARCH"

          if [ "$(whoami)" = "root" ]; then
            echo ""
            echo "ERROR:"
            echo "Do not run Unity CI as root."
            echo "Run actions-runner using your normal macOS account."
            exit 1
          fi


          # --------------------------------------------------------
          # Homebrew PATH
          # --------------------------------------------------------

          if [ -x "/opt/homebrew/bin/brew" ]; then

            # Apple Silicon
            export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"

            echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
            echo "/opt/homebrew/sbin" >> "$GITHUB_PATH"

            BREW="/opt/homebrew/bin/brew"

          elif [ -x "/usr/local/bin/brew" ]; then

            # Intel Mac
            export PATH="/usr/local/bin:/usr/local/sbin:$PATH"

            echo "/usr/local/bin" >> "$GITHUB_PATH"
            echo "/usr/local/sbin" >> "$GITHUB_PATH"

            BREW="/usr/local/bin/brew"

          else

            echo "ERROR: Homebrew is not installed."
            exit 1

          fi


          # --------------------------------------------------------
          # Git LFS
          # --------------------------------------------------------

          if ! command -v git-lfs >/dev/null 2>&1; then

            echo ""
            echo "Git LFS not found."
            echo "Installing Git LFS..."

            "$BREW" install git-lfs

          fi


          # --------------------------------------------------------
          # GitHub CLI
          # --------------------------------------------------------

          if ! command -v gh >/dev/null 2>&1; then

            echo ""
            echo "GitHub CLI not found."
            echo "Installing GitHub CLI..."

            "$BREW" install gh

          fi


          echo ""
          echo "Git LFS:"
          git lfs version

          echo ""
          echo "GitHub CLI:"
          gh --version


      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

          # Keep Unity Library on the self-hosted machine.
          clean: false


      # ============================================================
      # GIT LFS
      # ============================================================

      - name: Pull Git LFS files
        shell: bash
        run: |
          git lfs install
          git lfs pull

          echo ""
          echo "Git LFS files:"
          git lfs ls-files || true


      # ============================================================
      # BUILD INFORMATION
      # ============================================================

      - name: Show build information
        shell: bash
        run: |
          echo "======================================"
          echo "MODDING EDITOR BUILD"
          echo "======================================"

          echo "Release:"
          echo "${{ github.ref_name }}"

          echo ""
          echo "Workspace:"
          echo "$GITHUB_WORKSPACE"

          echo ""
          echo "Unity project version:"
          cat ProjectSettings/ProjectVersion.txt

          echo ""
          echo "Current commit:"
          git log -1 --oneline


      # ============================================================
      # REMOVE DS_STORE BEFORE UNITY BUILD
      # ============================================================
      #
      # Only removes .DS_Store from the checked-out Unity Assets.
      # Does NOT clean your Mac, Library, Homebrew, etc.
      # ============================================================

      - name: Remove .DS_Store from Unity Assets
        shell: bash
        run: |
          echo "======================================"
          echo "REMOVE .DS_STORE"
          echo "======================================"

          echo "Found:"

          find "$GITHUB_WORKSPACE/Assets" \
            -type f \
            -name ".DS_Store" \
            -print || true

          echo ""
          echo "Deleting..."

          find "$GITHUB_WORKSPACE/Assets" \
            -type f \
            -name ".DS_Store" \
            -delete


          echo ""
          echo "Checking remaining .DS_Store files..."

          REMAINING=$(find "$GITHUB_WORKSPACE/Assets" \
            -type f \
            -name ".DS_Store" \
            -print)

          if [ -n "$REMAINING" ]; then

            echo "ERROR:"
            echo "$REMAINING"

            exit 1

          fi

          echo "No .DS_Store files remain in Assets."


      # ============================================================
      # SPECIFIC STREAMING ASSETS CHECK
      # ============================================================

      - name: Verify StreamingAssets
        shell: bash
        run: |
          echo "======================================"
          echo "STREAMING ASSETS"
          echo "======================================"

          if [ -d "$GITHUB_WORKSPACE/Assets/StreamingAssets" ]; then

            find "$GITHUB_WORKSPACE/Assets/StreamingAssets" \
              -maxdepth 3 \
              -print

          else

            echo "No StreamingAssets folder."

          fi


          if [ -f "$GITHUB_WORKSPACE/Assets/StreamingAssets/.DS_Store" ]; then

            echo ""
            echo "ERROR:"
            echo "Assets/StreamingAssets/.DS_Store still exists."

            exit 1

          fi


      # ============================================================
      # VERIFY UNITY
      # ============================================================

      - name: Verify Unity installation
        shell: bash
        run: |
          UNITY="/Applications/Unity/Hub/Editor/6000.0.75f1/Unity.app/Contents/MacOS/Unity"

          echo "======================================"
          echo "UNITY"
          echo "======================================"

          if [ ! -x "$UNITY" ]; then

            echo "ERROR:"
            echo "Unity 6000.0.75f1 not found:"
            echo "$UNITY"

            echo ""
            echo "Installed Unity versions:"

            ls -la \
              "/Applications/Unity/Hub/Editor/" \
              || true

            exit 1

          fi

          echo "Unity found:"
          echo "$UNITY"


      # ============================================================
      # VERIFY WINDOWS BUILD SUPPORT
      # ============================================================
      #
      # Correct Unity 6000.0.75f1 macOS module path.
      # ============================================================

      - name: Verify Windows Build Support
        shell: bash
        run: |
          WINDOWS_SUPPORT="/Applications/Unity/Hub/Editor/6000.0.75f1/PlaybackEngines/WindowsStandaloneSupport"

          echo "======================================"
          echo "WINDOWS BUILD SUPPORT"
          echo "======================================"

          if [ ! -d "$WINDOWS_SUPPORT" ]; then

            echo ""
            echo "ERROR:"
            echo "Windows Build Support was not found."

            echo ""
            echo "Expected path:"
            echo "$WINDOWS_SUPPORT"

            exit 1

          fi

          echo "Windows Build Support found:"
          echo "$WINDOWS_SUPPORT"

          echo ""
          echo "Files:"
          ls -la "$WINDOWS_SUPPORT" | head -50


      # ============================================================
      # SHOW BUILD SCENE SETTINGS
      # ============================================================

      - name: Show Unity build scenes
        shell: bash
        run: |
          echo "======================================"
          echo "EDITOR BUILD SETTINGS"
          echo "======================================"

          cat \
            "$GITHUB_WORKSPACE/ProjectSettings/EditorBuildSettings.asset" \
            || true


      # ============================================================
      # REMOVE ONLY PREVIOUS CI BUILD OUTPUT
      # ============================================================
      #
      # Does NOT delete Library.
      # Does NOT delete project Assets.
      # Does NOT clean the Mac.
      # ============================================================

      - name: Prepare build folders
        shell: bash
        run: |
          echo "======================================"
          echo "PREPARE BUILD FOLDERS"
          echo "======================================"

          rm -rf "$GITHUB_WORKSPACE/build/Windows"
          rm -rf "$GITHUB_WORKSPACE/build/macOS"

          rm -rf "$GITHUB_WORKSPACE/ZipTest"

          rm -f "$GITHUB_WORKSPACE/ModdingEditor-Windows.zip"
          rm -f "$GITHUB_WORKSPACE/ModdingEditor-macOS.zip"

          rm -f "$GITHUB_WORKSPACE/windows-build.log"
          rm -f "$GITHUB_WORKSPACE/macos-build.log"

          mkdir -p "$GITHUB_WORKSPACE/build/Windows"
          mkdir -p "$GITHUB_WORKSPACE/build/macOS"


      # ============================================================
      # WINDOWS BUILD
      # ============================================================

      - name: Build Windows
        shell: bash

        env:
          RELEASE_VERSION: ${{ github.ref_name }}

        run: |
          UNITY="/Applications/Unity/Hub/Editor/6000.0.75f1/Unity.app/Contents/MacOS/Unity"

          LOG="$GITHUB_WORKSPACE/windows-build.log"

          echo "======================================"
          echo "BUILD WINDOWS"
          echo "======================================"

          set +e
          set -o pipefail

          "$UNITY" \
            -batchmode \
            -quit \
            -accept-apiupdate \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod CIBuilder.BuildWindows \
            -logFile - \
            2>&1 | tee "$LOG"

          EXIT_CODE=${PIPESTATUS[0]}

          set -e


          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "======================================"
            echo "WINDOWS BUILD FAILED"
            echo "======================================"

            grep -nEi \
              "error CS|Exception|BuildFailed|Failed|Aborting|executeMethod|Compilation failed|BuildPlayer" \
              "$LOG" \
              | tail -200 \
              || true

            exit "$EXIT_CODE"

          fi

          echo ""
          echo "Windows Unity process completed."


      # ============================================================
      # VERIFY WINDOWS BUILD
      # ============================================================

      - name: Verify Windows executable
        shell: bash
        run: |
          echo "======================================"
          echo "VERIFY WINDOWS BUILD"
          echo "======================================"

          EXE_PATH=$(find "$GITHUB_WORKSPACE/build/Windows" \
            -type f \
            -name "ModdingEditor.exe" \
            -print \
            -quit)


          if [ -z "$EXE_PATH" ]; then

            echo "ERROR:"
            echo "ModdingEditor.exe was not found."

            echo ""
            echo "Build folder:"

            find "$GITHUB_WORKSPACE/build/Windows" \
              -maxdepth 6 \
              -print \
              || true

            exit 1

          fi


          echo "Windows executable:"
          echo "$EXE_PATH"

          ls -lh "$EXE_PATH"


      # ============================================================
      # WINDOWS .DS_STORE CHECK
      # ============================================================

      - name: Verify Windows build metadata
        shell: bash
        run: |
          FOUND=$(find "$GITHUB_WORKSPACE/build/Windows" \
            -type f \
            -name ".DS_Store" \
            -print)


          if [ -n "$FOUND" ]; then

            echo "ERROR:"
            echo ".DS_Store was copied into Windows build:"

            echo "$FOUND"

            exit 1

          fi

          echo "Windows build contains no .DS_Store."


      # ============================================================
      # CREATE WINDOWS ZIP
      # ============================================================

      - name: Create Windows ZIP
        shell: bash
        run: |
          echo "======================================"
          echo "CREATE WINDOWS ZIP"
          echo "======================================"

          /usr/bin/ditto \
            -c \
            -k \
            --keepParent \
            "$GITHUB_WORKSPACE/build/Windows" \
            "$GITHUB_WORKSPACE/ModdingEditor-Windows.zip"

          echo ""
          echo "Windows ZIP:"

          ls -lh \
            "$GITHUB_WORKSPACE/ModdingEditor-Windows.zip"


      # ============================================================
      # REMOVE DS_STORE AGAIN BEFORE MAC BUILD
      # ============================================================

      - name: Final .DS_Store cleanup before macOS build
        shell: bash
        run: |
          echo "======================================"
          echo "MACOS PRE-BUILD DS_STORE CHECK"
          echo "======================================"

          find "$GITHUB_WORKSPACE/Assets" \
            -type f \
            -name ".DS_Store" \
            -print \
            -delete


          REMAINING=$(find "$GITHUB_WORKSPACE/Assets" \
            -type f \
            -name ".DS_Store" \
            -print)


          if [ -n "$REMAINING" ]; then

            echo "ERROR:"
            echo "$REMAINING"

            exit 1

          fi

          echo "Ready for macOS build."


      # ============================================================
      # MACOS BUILD
      # ============================================================

      - name: Build macOS
        shell: bash

        env:
          RELEASE_VERSION: ${{ github.ref_name }}

        run: |
          UNITY="/Applications/Unity/Hub/Editor/6000.0.75f1/Unity.app/Contents/MacOS/Unity"

          LOG="$GITHUB_WORKSPACE/macos-build.log"

          echo "======================================"
          echo "BUILD MACOS"
          echo "======================================"

          set +e
          set -o pipefail

          "$UNITY" \
            -batchmode \
            -quit \
            -accept-apiupdate \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod CIBuilder.BuildMacOS \
            -logFile - \
            2>&1 | tee "$LOG"

          EXIT_CODE=${PIPESTATUS[0]}

          set -e


          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "======================================"
            echo "MACOS BUILD FAILED"
            echo "======================================"

            grep -nEi \
              "error CS|Exception|BuildFailed|Failed|Aborting|executeMethod|Compilation failed|BuildPlayer" \
              "$LOG" \
              | tail -200 \
              || true

            exit "$EXIT_CODE"

          fi

          echo ""
          echo "macOS Unity process completed."


      # ============================================================
      # FIND MACOS APPLICATION
      # ============================================================

      - name: Verify macOS application
        shell: bash
        run: |
          echo "======================================"
          echo "VERIFY MACOS APP"
          echo "======================================"

          APP=$(find "$GITHUB_WORKSPACE/build/macOS" \
            -type d \
            -name "ModdingEditor.app" \
            -print \
            -quit)


          if [ -z "$APP" ]; then

            echo "ERROR:"
            echo "ModdingEditor.app was not found."

            find "$GITHUB_WORKSPACE/build/macOS" \
              -maxdepth 7 \
              -print \
              || true

            exit 1

          fi


          echo "macOS application:"
          echo "$APP"


      # ============================================================
      # CHECK DS_STORE INSIDE GENERATED APP
      # ============================================================
      #
      # IMPORTANT:
      #
      # Do NOT delete .DS_Store here.
      #
      # Unity has already signed the application.
      # Changing the app after signing can invalidate its seal.
      # ============================================================

      - name: Check macOS app for .DS_Store
        shell: bash
        run: |
          APP=$(find "$GITHUB_WORKSPACE/build/macOS" \
            -type d \
            -name "ModdingEditor.app" \
            -print \
            -quit)


          FOUND=$(find "$APP" \
            -type f \
            -name ".DS_Store" \
            -print)


          if [ -n "$FOUND" ]; then

            echo ""
            echo "ERROR:"
            echo ".DS_Store was included in ModdingEditor.app:"
            echo ""

            echo "$FOUND"

            echo ""
            echo "Stopping release before packaging."

            exit 1

          fi


          echo "No .DS_Store inside ModdingEditor.app."


      # ============================================================
      # VERIFY UNITY AD-HOC SIGNATURE
      # ============================================================

      - name: Verify macOS code signature
        shell: bash
        run: |
          APP=$(find "$GITHUB_WORKSPACE/build/macOS" \
            -type d \
            -name "ModdingEditor.app" \
            -print \
            -quit)


          echo "======================================"
          echo "VERIFY MACOS SIGNATURE"
          echo "======================================"

          /usr/bin/codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"


      # ============================================================
      # CREATE MACOS ZIP
      # ============================================================

      - name: Create macOS ZIP
        shell: bash
        run: |
          APP=$(find "$GITHUB_WORKSPACE/build/macOS" \
            -type d \
            -name "ModdingEditor.app" \
            -print \
            -quit)


          echo "======================================"
          echo "CREATE MACOS ZIP"
          echo "======================================"

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "$GITHUB_WORKSPACE/ModdingEditor-macOS.zip"


          echo ""
          echo "macOS ZIP:"

          ls -lh \
            "$GITHUB_WORKSPACE/ModdingEditor-macOS.zip"


      # ============================================================
      # EXTRACT ZIP AND VERIFY SIGNATURE AGAIN
      # ============================================================
      #
      # Prevents another:
      #
      # "a sealed resource is missing or invalid"
      #
      # release.
      # ============================================================

      - name: Verify packaged macOS app
        shell: bash
        run: |
          echo "======================================"
          echo "VERIFY PACKAGED MACOS APP"
          echo "======================================"

          rm -rf "$GITHUB_WORKSPACE/ZipTest"

          mkdir -p "$GITHUB_WORKSPACE/ZipTest"


          /usr/bin/ditto \
            -x \
            -k \
            "$GITHUB_WORKSPACE/ModdingEditor-macOS.zip" \
            "$GITHUB_WORKSPACE/ZipTest"


          TEST_APP=$(find "$GITHUB_WORKSPACE/ZipTest" \
            -type d \
            -name "ModdingEditor.app" \
            -print \
            -quit)


          if [ -z "$TEST_APP" ]; then

            echo "ERROR:"
            echo "ModdingEditor.app not found after ZIP extraction."

            exit 1

          fi


          echo "Extracted app:"
          echo "$TEST_APP"


          echo ""
          echo "Checking .DS_Store..."


          FOUND=$(find "$TEST_APP" \
            -type f \
            -name ".DS_Store" \
            -print)


          if [ -n "$FOUND" ]; then

            echo "ERROR:"
            echo ".DS_Store exists in packaged app:"

            echo "$FOUND"

            exit 1

          fi


          echo ""
          echo "Checking code signature..."


          /usr/bin/codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$TEST_APP"


          echo ""
          echo "Packaged macOS application is valid."


      # ============================================================
      # FINAL RELEASE FILE CHECK
      # ============================================================

      - name: Verify final release files
        shell: bash
        run: |
          echo "======================================"
          echo "FINAL FILES"
          echo "======================================"

          WINDOWS="$GITHUB_WORKSPACE/ModdingEditor-Windows.zip"
          MAC="$GITHUB_WORKSPACE/ModdingEditor-macOS.zip"


          if [ ! -f "$WINDOWS" ]; then

            echo "ERROR: Windows ZIP missing."

            exit 1

          fi


          if [ ! -f "$MAC" ]; then

            echo "ERROR: macOS ZIP missing."

            exit 1

          fi


          ls -lh "$WINDOWS"
          ls -lh "$MAC"


      # ============================================================
      # PUBLISH GITHUB RELEASE
      # ============================================================

      - name: Publish GitHub Release
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          TAG="${{ github.ref_name }}"

          echo "======================================"
          echo "PUBLISH RELEASE"
          echo "======================================"

          echo "Tag:"
          echo "$TAG"


          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1
          then

            echo ""
            echo "Release already exists."
            echo "Replacing build files..."


            gh release upload "$TAG" \
              "$GITHUB_WORKSPACE/ModdingEditor-Windows.zip" \
              "$GITHUB_WORKSPACE/ModdingEditor-macOS.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

          else

            echo ""
            echo "Creating release..."


            gh release create "$TAG" \
              "$GITHUB_WORKSPACE/ModdingEditor-Windows.zip" \
              "$GITHUB_WORKSPACE/ModdingEditor-macOS.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Modding Editor $TAG" \
              --generate-notes

          fi


          echo ""
          echo "======================================"
          echo "RELEASE COMPLETE"
          echo "======================================"
