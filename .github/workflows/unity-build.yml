name: Build Modding Editor Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build-release:
    name: Build Windows + macOS

    runs-on:
      - self-hosted
      - macOS

    steps:

      # ==========================================================
      # CHECK RUNNER USER
      # ==========================================================

      - name: Check runner
        shell: bash
        run: |
          echo "======================================"
          echo "SELF HOSTED MAC"
          echo "======================================"

          echo "User:"
          whoami

          echo ""
          echo "Home:"
          echo "$HOME"

          echo ""
          echo "Runner:"
          echo "$RUNNER_NAME"

          echo ""
          echo "Architecture:"
          echo "$RUNNER_ARCH"

          if [ "$(whoami)" = "root" ]; then
            echo ""
            echo "ERROR:"
            echo "GitHub runner is running as root."
            echo "Run the runner using the same macOS user that"
            echo "has Unity Hub and the Unity license activated."
            exit 1
          fi


      # ==========================================================
      # PREPARE HOMEBREW / GIT LFS
      # ==========================================================

      - name: Prepare Git LFS
        shell: bash
        run: |
          if [ -x "/opt/homebrew/bin/brew" ]; then

            echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
            echo "/opt/homebrew/sbin" >> "$GITHUB_PATH"

            export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"

            BREW="/opt/homebrew/bin/brew"

          elif [ -x "/usr/local/bin/brew" ]; then

            echo "/usr/local/bin" >> "$GITHUB_PATH"
            echo "/usr/local/sbin" >> "$GITHUB_PATH"

            export PATH="/usr/local/bin:/usr/local/sbin:$PATH"

            BREW="/usr/local/bin/brew"

          else

            echo "ERROR: Homebrew not found."
            exit 1

          fi

          if ! command -v git-lfs >/dev/null 2>&1; then
            "$BREW" install git-lfs
          fi

          git lfs version
          git lfs install --skip-repo


      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false


      # ==========================================================
      # DOWNLOAD LFS FILES
      # ==========================================================

      - name: Download Git LFS files
        shell: bash
        run: |
          git lfs install
          git lfs pull


      # ==========================================================
      # VERIFY UNITY
      # ==========================================================

      - name: Verify Unity
        shell: bash
        run: |
          UNITY="/Applications/Unity/Hub/Editor/6000.0.75f1/Unity.app/Contents/MacOS/Unity"

          if [ ! -x "$UNITY" ]; then

            echo "ERROR: Unity 6000.0.75f1 not found."

            echo ""
            echo "Installed Unity versions:"

            ls -la "/Applications/Unity/Hub/Editor/" || true

            exit 1
          fi

          echo "Unity found:"
          echo "$UNITY"


      # ==========================================================
      # DELETE ONLY PREVIOUS BUILD OUTPUT
      # ==========================================================

      - name: Prepare build output
        shell: bash
        run: |
          rm -rf Build/Windows
          rm -rf Build/macOS

          rm -f ModdingEditor-Windows.zip
          rm -f ModdingEditor-macOS.zip

          mkdir -p Build/Windows
          mkdir -p Build/macOS


      # ==========================================================
      # WINDOWS BUILD
      # ==========================================================

      - name: Build Windows
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

        run: |
          UNITY="/Applications/Unity/Hub/Editor/6000.0.75f1/Unity.app/Contents/MacOS/Unity"

          LOG="$GITHUB_WORKSPACE/windows-build.log"

          set +e

          "$UNITY" \
            -batchmode \
            -quit \
            -accept-apiupdate \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod CIBuilder.BuildWindows \
            -logFile "$LOG"

          EXIT_CODE=$?

          set -e

          echo ""
          echo "======================================"
          echo "WINDOWS UNITY LOG"
          echo "======================================"

          cat "$LOG" || true

          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "Windows build failed: $EXIT_CODE"
            exit $EXIT_CODE
          fi


      # ==========================================================
      # VERIFY WINDOWS EXE
      # ==========================================================

      - name: Verify Windows executable
        shell: bash
        run: |
          if [ ! -f "Build/Windows/ModdingEditor.exe" ]; then

            echo "ERROR: ModdingEditor.exe was not created."

            find Build/Windows -maxdepth 5 -print

            exit 1
          fi

          echo "Windows executable:"
          ls -lh Build/Windows/ModdingEditor.exe


      # ==========================================================
      # WINDOWS ZIP
      # ==========================================================

      - name: Create Windows ZIP
        shell: bash
        run: |
          /usr/bin/ditto \
            -c \
            -k \
            --keepParent \
            "Build/Windows" \
            "ModdingEditor-Windows.zip"

          ls -lh ModdingEditor-Windows.zip


      # ==========================================================
      # MACOS BUILD
      # ==========================================================

      - name: Build macOS
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

        run: |
          UNITY="/Applications/Unity/Hub/Editor/6000.0.75f1/Unity.app/Contents/MacOS/Unity"

          LOG="$GITHUB_WORKSPACE/macos-build.log"

          set +e

          "$UNITY" \
            -batchmode \
            -quit \
            -accept-apiupdate \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod CIBuilder.BuildMacOS \
            -logFile "$LOG"

          EXIT_CODE=$?

          set -e

          echo ""
          echo "======================================"
          echo "MACOS UNITY LOG"
          echo "======================================"

          cat "$LOG" || true

          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "macOS build failed: $EXIT_CODE"
            exit $EXIT_CODE
          fi


      # ==========================================================
      # VERIFY MAC APP
      # ==========================================================

      - name: Verify macOS application
        shell: bash
        run: |
          if [ ! -d "Build/macOS/ModdingEditor.app" ]; then

            echo "ERROR: ModdingEditor.app was not created."

            find Build/macOS -maxdepth 5 -print

            exit 1
          fi

          echo "macOS application found:"
          ls -ld Build/macOS/ModdingEditor.app


      # ==========================================================
      # MACOS ZIP
      # ==========================================================

      - name: Create macOS ZIP
        shell: bash
        run: |
          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "Build/macOS/ModdingEditor.app" \
            "ModdingEditor-macOS.zip"

          ls -lh ModdingEditor-macOS.zip


      # ==========================================================
      # VERIFY FINAL FILES
      # ==========================================================

      - name: Verify release files
        shell: bash
        run: |
          test -f ModdingEditor-Windows.zip
          test -f ModdingEditor-macOS.zip

          echo "======================================"
          echo "FINAL RELEASE FILES"
          echo "======================================"

          ls -lh ModdingEditor-Windows.zip
          ls -lh ModdingEditor-macOS.zip


      # ==========================================================
      # GITHUB RELEASE
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Modding Editor ${{ github.ref_name }}

          generate_release_notes: true

          fail_on_unmatched_files: true

          files: |
            ModdingEditor-Windows.zip
            ModdingEditor-macOS.zip

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
