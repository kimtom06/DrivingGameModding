name: Build Modding Editor Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows + macOS
    runs-on: [self-hosted, macOS]

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true


      # ============================================================
      # SHOW UNITY VERSION
      # ============================================================

      - name: Show build information
        shell: bash
        run: |
          echo "======================================"
          echo "Modding Editor Build"
          echo "======================================"
          echo "Tag: ${{ github.ref_name }}"
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
          echo ""
          echo "Unity project version:"
          cat ProjectSettings/ProjectVersion.txt


      # ============================================================
      # WINDOWS BUILD
      # ============================================================

      - name: Build Windows
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 6000.0.75f1
          targetPlatform: StandaloneWindows64

          buildName: ModdingEditor
          buildsPath: build

          versioning: Tag

          # IMPORTANT:
          # Use the Unity license already activated on this Mac.
          skipActivation: true


      # ============================================================
      # CHECK WINDOWS BUILD
      # ============================================================

      - name: Find Windows executable
        shell: bash
        run: |
          echo "======================================"
          echo "WINDOWS BUILD OUTPUT"
          echo "======================================"

          find build -maxdepth 6 -print

          EXE_PATH=$(find build -type f -name "ModdingEditor.exe" -print -quit)

          if [ -z "$EXE_PATH" ]; then
            echo ""
            echo "ERROR: ModdingEditor.exe was not found!"
            exit 1
          fi

          echo ""
          echo "Windows executable found:"
          echo "$EXE_PATH"


      # ============================================================
      # ZIP WINDOWS BUILD
      # ============================================================

      - name: Create Windows ZIP
        shell: bash
        run: |
          EXE_PATH=$(find build -type f -name "ModdingEditor.exe" -print -quit)

          if [ -z "$EXE_PATH" ]; then
            echo "ERROR: ModdingEditor.exe was not found."
            exit 1
          fi

          BUILD_DIR=$(dirname "$EXE_PATH")

          echo "Windows build directory:"
          echo "$BUILD_DIR"

          /usr/bin/ditto \
            -c \
            -k \
            --keepParent \
            "$BUILD_DIR" \
            "$GITHUB_WORKSPACE/ModdingEditor-Windows.zip"

          echo ""
          echo "Windows ZIP created:"
          ls -lh "$GITHUB_WORKSPACE/ModdingEditor-Windows.zip"


      # ============================================================
      # MACOS BUILD
      # ============================================================

      - name: Build macOS
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 6000.0.75f1
          targetPlatform: StandaloneOSX

          buildName: ModdingEditor
          buildsPath: build

          versioning: Tag

          # Use existing Unity Hub / Personal license.
          skipActivation: true


      # ============================================================
      # CHECK MACOS BUILD
      # ============================================================

      - name: Find macOS application
        shell: bash
        run: |
          echo "======================================"
          echo "MACOS BUILD OUTPUT"
          echo "======================================"

          find build -maxdepth 6 -print

          APP_PATH=$(find build -type d -name "ModdingEditor.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo ""
            echo "ERROR: ModdingEditor.app was not found!"
            exit 1
          fi

          echo ""
          echo "macOS application found:"
          echo "$APP_PATH"


      # ============================================================
      # ZIP MACOS BUILD
      # ============================================================

      - name: Create macOS ZIP
        shell: bash
        run: |
          APP_PATH=$(find build -type d -name "ModdingEditor.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ModdingEditor.app was not found."
            exit 1
          fi

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "$GITHUB_WORKSPACE/ModdingEditor-macOS.zip"

          echo ""
          echo "macOS ZIP created:"
          ls -lh "$GITHUB_WORKSPACE/ModdingEditor-macOS.zip"


      # ============================================================
      # CHECK BOTH RELEASE FILES
      # ============================================================

      - name: Verify release files
        shell: bash
        run: |
          echo "======================================"
          echo "RELEASE FILES"
          echo "======================================"

          if [ ! -f "ModdingEditor-Windows.zip" ]; then
            echo "ERROR: ModdingEditor-Windows.zip not found"
            exit 1
          fi

          if [ ! -f "ModdingEditor-macOS.zip" ]; then
            echo "ERROR: ModdingEditor-macOS.zip not found"
            exit 1
          fi

          ls -lh ModdingEditor-Windows.zip
          ls -lh ModdingEditor-macOS.zip


      # ============================================================
      # OPTIONAL ACTIONS ARTIFACT BACKUP
      # ============================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ModdingEditor-${{ github.ref_name }}
          path: |
            ModdingEditor-Windows.zip
            ModdingEditor-macOS.zip
          if-no-files-found: error


      # ============================================================
      # CREATE GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Modding Editor ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}

          generate_release_notes: true

          files: |
            ModdingEditor-Windows.zip
            ModdingEditor-macOS.zip

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
